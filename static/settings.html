<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Keys - Email Sender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --card-border: #27272a;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --radius: 12px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      width: 100%;
      max-width: 960px;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .nav-tabs {
      width: 100%;
      max-width: 960px;
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .nav-tab {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-tab:hover { color: var(--text); background: #1e1e24; }
    .nav-tab.active { color: var(--text); background: var(--card); border: 1px solid var(--card-border); font-weight: 600; }

    main {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 1rem;
      align-items: flex-end;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input {
      background-color: #0d0d10;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      height: 44px;
    }

    button.btn-danger {
      background-color: #7f1d1d;
      color: #fca5a5;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      height: auto;
    }

    button.btn-danger:hover {
      background-color: var(--error);
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--card-border);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-align: left;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #202025;
      vertical-align: middle;
    }

    tr:hover td { background-color: #1c1c22; }

    .key-code {
      font-family: var(--font-mono);
      background: #0c0c0f;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.85rem;
      border: 1px solid var(--card-border);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      height: auto;
    }

    .copy-btn:hover { color: var(--text); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 1.75rem;">✉️</span>
      <h1>email<span style="color: var(--primary);">-sender</span></h1>
    </div>
  </header>

  <nav class="nav-tabs">
    <a href="index.html" class="nav-tab">✉️ Send Console</a>
    <a href="history.html" class="nav-tab">📜 Dispatch History</a>
    <a href="settings.html" class="nav-tab active">🔑 API Keys</a>
    <a href="integration.html" class="nav-tab">🔌 API Docs</a>
  </nav>

  <main>
    <!-- Add New Key -->
    <div class="card">
      <div class="card-title">➕ Register Client Application Key</div>
      <form id="key-form" class="form-row">
        <div class="form-group">
          <label for="app-name">Application Identifier</label>
          <input type="text" id="app-name" placeholder="e.g. ccard-studio, trace" required />
        </div>
        <div class="form-group">
          <label for="custom-key">Custom API Key (Optional — auto-generated if blank)</label>
          <input type="text" id="custom-key" placeholder="Leave blank to auto-generate" />
        </div>
        <button type="submit"><span>➕ Create Key</span></button>
      </form>
    </div>

    <!-- Active Keys List -->
    <div class="card">
      <div class="card-title">🔑 Active Application Keys</div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Application</th>
              <th>API Key (`X-API-KEY`)</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="keys-table-body">
            <tr>
              <td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading API keys...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    async function loadKeys() {
      try {
        const res = await fetch('/api/keys');
        const data = await res.json();
        const tbody = document.getElementById('keys-table-body');

        if (!data.success || data.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-muted);">No active API keys found. Register one above.</td></tr>';
          return;
        }

        tbody.innerHTML = data.data.map(item => `
          <tr>
            <td style="font-weight: 600;">${item.app_name}</td>
            <td>
              <span class="key-code">
                <span>${item.api_key}</span>
                <button class="copy-btn" onclick="navigator.clipboard.writeText('${item.api_key}'); alert('Key copied to clipboard!');" title="Copy Key">📋</button>
              </span>
            </td>
            <td style="color: var(--text-muted); font-size: 0.8rem;">${new Date(item.created_at).toLocaleDateString()}</td>
            <td>
              <button class="btn-danger" onclick="revokeKey('${item.app_name}')">Revoke</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Failed to load keys:', err);
      }
    }

    async function revokeKey(appName) {
      if (!confirm(`Are you sure you want to revoke access for '${appName}'?`)) return;

      try {
        const res = await fetch(`/api/keys/${encodeURIComponent(appName)}`, { method: 'DELETE' });
        if (res.ok) {
          loadKeys();
        } else {
          alert('Failed to revoke key');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    document.getElementById('key-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const appName = document.getElementById('app-name').value.trim();
      const apiKey = document.getElementById('custom-key').value.trim();

      try {
        const res = await fetch('/api/keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ appName, apiKey: apiKey || undefined })
        });

        if (res.ok) {
          document.getElementById('app-name').value = '';
          document.getElementById('custom-key').value = '';
          loadKeys();
        } else {
          alert('Failed to register key');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    loadKeys();
  </script>
</body>
</html>
