<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch History - Email Sender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --card-border: #27272a;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --radius: 12px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      width: 100%;
      max-width: 1100px;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .nav-tabs {
      width: 100%;
      max-width: 1100px;
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
    }

    .nav-tab {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-tab:hover { color: var(--text); background: #1e1e24; }
    .nav-tab.active { color: var(--text); background: var(--card); border: 1px solid var(--card-border); font-weight: 600; }

    main { width: 100%; max-width: 1100px; }

    .card {
      background-color: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    .toolbar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    input, select {
      background-color: #0d0d10;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      color: var(--text);
      font-size: 0.875rem;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th {
      padding: 0.75rem 1rem;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--card-border);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #202025;
      vertical-align: middle;
    }

    tr:hover td { background-color: #1c1c22; }

    .pill {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .pill.sent { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .pill.failed { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span style="font-size: 1.75rem;">✉️</span>
      <h1>email<span style="color: var(--primary);">-sender</span></h1>
    </div>
  </header>

  <nav class="nav-tabs">
    <a href="index.html" class="nav-tab">✉️ Send Console</a>
    <a href="history.html" class="nav-tab active">📜 Dispatch History</a>
    <a href="settings.html" class="nav-tab">🔑 API Keys</a>
    <a href="integration.html" class="nav-tab">🔌 API Docs</a>
  </nav>

  <main>
    <div class="card">
      <div class="toolbar">
        <div class="filter-group">
          <input type="text" id="app-filter" placeholder="Filter by App..." />
          <select id="status-filter">
            <option value="">All Statuses</option>
            <option value="sent">Sent</option>
            <option value="failed">Failed</option>
          </select>
          <button onclick="loadHistory()">Filter</button>
        </div>
        <button style="background: #27272a;" onclick="loadHistory()">🔄 Refresh</button>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Status</th>
              <th>App Source</th>
              <th>Recipient</th>
              <th>Subject</th>
              <th>Message ID / Error</th>
              <th>Timestamp</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <tr>
              <td colspan="6" class="empty-state">Loading dispatch history...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    async function loadHistory() {
      const app = document.getElementById('app-filter').value.trim();
      const status = document.getElementById('status-filter').value;

      let url = '/api/history?limit=100';
      if (app) url += `&app=${encodeURIComponent(app)}`;
      if (status) url += `&status=${encodeURIComponent(status)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const tbody = document.getElementById('history-table-body');

        if (!data.success || data.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No email dispatch records found.</td></tr>';
          return;
        }

        tbody.innerHTML = data.data.map(item => `
          <tr>
            <td><span class="pill ${item.status}">${item.status}</span></td>
            <td style="font-family: var(--font-mono); font-weight: 500;">${item.app_name}</td>
            <td>${item.recipient}</td>
            <td><strong>${item.subject}</strong></td>
            <td style="font-family: var(--font-mono); font-size: 0.75rem; color: ${item.status === 'failed' ? '#fca5a5' : 'var(--text-muted)'}; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${item.message_id || item.error_details || ''}">
              ${item.message_id || item.error_details || '-'}
            </td>
            <td style="color: var(--text-muted); font-size: 0.8rem; white-space: nowrap;">
              ${new Date(item.timestamp).toLocaleString()}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Failed to load history:', err);
      }
    }

    loadHistory();
  </script>
</body>
</html>
